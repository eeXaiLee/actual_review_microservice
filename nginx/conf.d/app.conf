server {
    listen 80;
    server_name 91.184.245.89 v3212274.hosted-by-vdsina.ru;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://v3212274.hosted-by-vdsina.ru$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name v3212274.hosted-by-vdsina.ru;

    ssl_certificate /etc/letsencrypt/live/v3212274.hosted-by-vdsina.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/v3212274.hosted-by-vdsina.ru/privkey.pem;

    location /static/ {
        alias /code/review_parser/static/;
    }

    location / {
        proxy_pass http://web:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
