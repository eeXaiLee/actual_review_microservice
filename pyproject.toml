[tool.ruff]
line-length = 80
target-version = "py312"
extend-exclude = ["*/migrations/*", "venv"]

[tool.ruff.lint]
# E/W — pycodestyle, F — pyflakes, I — сортировка импортов (замена isort).
select = ["E", "F", "W", "I"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
plugins = ["mypy_django_plugin.main"]
ignore_missing_imports = true
exclude = ["migrations/"]

[tool.django-stubs]
django_settings_module = "review_parser.settings"

[tool.flake8]
max-line-length = 80
extend-ignore = ["E203"]  # пробел перед ":" в срезах — стиль Black/ruff format
exclude = ["migrations", "venv"]
